name: agentforge-dev

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: agentforge_dev
      POSTGRES_USER: agentforge
      POSTGRES_PASSWORD: ${AGENTFORGE_POSTGRES_PASSWORD:?Set AGENTFORGE_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${AGENTFORGE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s

volumes:
  postgres_data:
